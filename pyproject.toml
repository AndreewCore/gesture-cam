[project]
name = "gesture-cam"
version = "0.1.0"
description = "Cámara que superpone imágenes según los gestos de la mano"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.scripts]
gesture-cam = "gesture_cam.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_cam"]
