[project]
name = "gesture-cam"
version = "0.3.0"
description = "Camera that overlays images based on hand gestures and body movements"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.scripts]
gesture-cam = "gesture_cam.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_cam"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
